<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Prateek Garg</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;700&family=Geist+Mono&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    .nf { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: var(--pad); }
    .nf h1 { font-size: clamp(6rem, 30vw, 26rem); line-height: 0.8; letter-spacing: -0.07em; margin: 0; }
    .nf p { font-size: clamp(1.4rem, 3vw, 2.4rem); margin: 24px 0 40px; }
    .nf a { align-self: flex-start; padding: 14px 24px; border-radius: 999px; background: var(--accent); color: var(--ink); font-weight: 600; }
  </style>
</head>
<body>
  <main class="nf">
    <h1>404</h1>
    <p>This record never <em style="color:var(--accent-text)">synced.</em></p>
    <a href="/">Back home →</a>
  </main>
</body>
</html>
